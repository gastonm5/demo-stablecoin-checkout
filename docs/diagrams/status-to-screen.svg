<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -14 988 328" width="988" height="328" role="img" aria-label="Four inputs feed the pure function deriveScreen: the server's latest answer, the statuses seen so far, the device clock, and the request history. The function returns one of six screens. The request history also drives a notice strip that is laid over any screen.">
<title>Four inputs feed the pure function deriveScreen: the server's latest answer, the statuses seen so far, the device clock, and the request history. The function returns one of six screens. The request history also drives a notice strip that is laid over any screen.</title>
<style>
  svg {
    --surface: #ffffff; --fg: #14161a; --muted: #586170; --line: #7b8594; --bg: #f5f6f9;
    --move: #2a55cf; --move-bg: #e6edfd; --wait: #9a5b00; --wait-bg: #fbefd6;
    --final: #4a5567; --final-bg: #e8ebf1; --stop: #b3261e; --stop-bg: #fbe8e6;
    --sans: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    --mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
    color: var(--line);
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --surface: #171b22; --fg: #e9ecf1; --muted: #9ca6b4; --line: #7f8a99; --bg: #0f1217;
      --move: #93b2ff; --move-bg: #1a2742; --wait: #f0b65a; --wait-bg: #33270f;
      --final: #b1bac8; --final-bg: #232a34; --stop: #ff8f85; --stop-bg: #3a1c1a;
    }
  }
  .card { fill: var(--surface); stroke: none; }
  .t-name { font-family: var(--mono); font-size: 13px; font-weight: 500; fill: var(--fg); }
  .t-title { font-family: var(--sans); font-size: 13px; font-weight: 600; fill: var(--fg); }
  .t-sub { font-family: var(--sans); font-size: 11.5px; fill: var(--muted); }
  .t-lbl { font-family: var(--sans); font-size: 12px; fill: var(--muted); }
  .t-band { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; font-weight: 600; }
  .t-band.move { fill: var(--move); } .t-band.wait { fill: var(--wait); } .t-band.final { fill: var(--final); }
  .edge { fill: none; stroke: currentColor; stroke-width: 1.4; }
  .edge.rare { stroke-dasharray: 5 4; }
  .band { stroke: none; opacity: .6; }
  .band.move { fill: var(--move-bg); } .band.wait { fill: var(--wait-bg); } .band.final { fill: var(--final-bg); }
  .node { stroke-width: 1.5; }
  .node.move { fill: var(--surface); stroke: var(--move); }
  .node.wait { fill: var(--surface); stroke: var(--wait); }
  .node.final { fill: var(--surface); stroke: var(--final); }
  .node.plain { fill: var(--surface); stroke: var(--line); }
  .node.stop { fill: var(--stop-bg); stroke: var(--stop); }
  .node.fn { fill: var(--fg); stroke: var(--fg); }
  .t-fn { font-family: var(--mono); font-size: 15px; font-weight: 600; fill: var(--bg); }
  .t-fnsub { font-family: var(--sans); font-size: 11.5px; fill: var(--bg); opacity: .75; }
  .dot { fill: var(--move); stroke: none; }
  .frame { fill: none; stroke: currentColor; stroke-width: 1.2; stroke-dasharray: 3 5; }
  .axis { stroke: currentColor; stroke-width: 1; opacity: .5; }
  .poll { fill: var(--move); stroke: none; }
  .poll.fail { fill: var(--surface); stroke: var(--stop); stroke-width: 1.6; }
</style>
<rect class="card" x="-14" y="-14" width="988" height="328" rx="14"/>
          <defs>
            <marker id="ds-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
            </marker>
          </defs>

          <rect class="node plain" x="24" y="18" width="262" height="46" rx="8"/>
          <text class="t-title" x="40" y="38">Server's latest answer</text>
          <text class="t-sub" x="40" y="54">the status and the fields that came with it</text>
          <rect class="node plain" x="24" y="80" width="262" height="46" rx="8"/>
          <text class="t-title" x="40" y="100">Statuses seen so far</text>
          <text class="t-sub" x="40" y="116">for this quote, since creation or a reload</text>
          <rect class="node plain" x="24" y="142" width="262" height="46" rx="8"/>
          <text class="t-title" x="40" y="162">Device clock</text>
          <text class="t-sub" x="40" y="178">used for the countdown and nothing else</text>
          <rect class="node plain" x="24" y="204" width="262" height="46" rx="8"/>
          <text class="t-title" x="40" y="224">Request history</text>
          <text class="t-sub" x="40" y="240">last answer, last failure, online or not</text>

          <path class="edge" d="M286,41 C340,41 336,112 390,112" marker-end="url(#ds-arrow)"/>
          <path class="edge" d="M286,103 C336,103 340,128 390,128" marker-end="url(#ds-arrow)"/>
          <path class="edge" d="M286,165 C336,165 340,148 390,148" marker-end="url(#ds-arrow)"/>
          <path class="edge" d="M286,227 C340,227 336,164 390,164" marker-end="url(#ds-arrow)"/>

          <rect class="node fn" x="390" y="92" width="190" height="92" rx="10"/>
          <text class="t-fn" x="485" y="134" text-anchor="middle">deriveScreen</text>
          <text class="t-fnsub" x="485" y="154" text-anchor="middle">pure: no timers, no requests</text>

          <path class="edge" d="M580,138 H648" marker-end="url(#ds-arrow)"/>
          <path class="edge" d="M664,20 H656 V240 H664"/>

          <rect class="node move" x="672" y="20" width="264" height="30" rx="15"/>
          <text class="t-title" x="688" y="40">Pay</text><text class="t-sub" x="720" y="40">the full amount, or the rest</text>
          <rect class="node wait" x="672" y="58" width="264" height="30" rx="15"/>
          <text class="t-title" x="688" y="78">Waiting</text><text class="t-sub" x="746" y="78">seen, counting confirmations</text>
          <rect class="node final" x="672" y="96" width="264" height="30" rx="15"/>
          <text class="t-title" x="688" y="116">Complete</text><text class="t-sub" x="756" y="116">with a notice if overpaid</text>
          <rect class="node move" x="672" y="134" width="264" height="30" rx="15"/>
          <text class="t-title" x="688" y="154">Expired</text><text class="t-sub" x="744" y="154">plain, cautious, or a dead end</text>
          <rect class="node final" x="672" y="172" width="264" height="30" rx="15"/>
          <text class="t-title" x="688" y="192">Failed</text><text class="t-sub" x="734" y="192">in three wordings</text>
          <rect class="node wait" x="672" y="210" width="264" height="30" rx="15"/>
          <text class="t-title" x="688" y="230">We're checking</text><text class="t-sub" x="792" y="230">don't send again</text>

          <path class="edge rare" d="M155,250 V276 H390" marker-end="url(#ds-arrow)"/>
          <rect class="node plain" x="390" y="260" width="546" height="32" rx="8"/>
          <text class="t-title" x="406" y="281">Notice strip</text>
          <text class="t-sub" x="492" y="281">"offline" or "can't reach the payment service", over any screen</text>
        </svg>
