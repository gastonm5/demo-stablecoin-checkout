          <text class="t-sub" x="335" y="184" text-anchor="middle">which view · the two writes</text>

          <rect class="node move" x="250" y="290" width="170" height="60" rx="8"/>
          <text class="t-name" x="335" y="315" text-anchor="middle">usePayment</text>
          <text class="t-sub" x="335" y="334" text-anchor="middle">one polling query</text>

          <rect class="node final" x="250" y="420" width="170" height="46" rx="8"/>
          <text class="t-title" x="335" y="440" text-anchor="middle">Query cache</text>
          <text class="t-sub" x="335" y="456" text-anchor="middle">payment + status sequence</text>

          <rect class="node final" x="490" y="420" width="150" height="46" rx="8"/>
          <text class="t-name" x="565" y="440" text-anchor="middle">src/api</text>
          <text class="t-sub" x="565" y="456" text-anchor="middle">fetch · timeout · zod</text>

          <rect class="node move" x="490" y="30" width="160" height="60" rx="8"/>
          <text class="t-name" x="570" y="55" text-anchor="middle">useCurrencies</text>
          <text class="t-sub" x="570" y="74" text-anchor="middle">the list, fetched once</text>

          <rect class="node move" x="720" y="30" width="120" height="46" rx="8"/>
          <text class="t-name" x="780" y="50" text-anchor="middle">useNow</text>
          <text class="t-sub" x="780" y="66" text-anchor="middle">ticks on a live quote</text>

