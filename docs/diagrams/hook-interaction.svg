          <text class="t-lbl" x="668" y="268">checkNow()</text>
          <text class="t-lbl" x="668" y="284">at zero</text>
          <path class="edge" d="M620,90 V130 H740 V180" marker-end="url(#hk-arrow)"/>
          <text class="t-lbl" x="680" y="122" text-anchor="middle">catalogue</text>
          <path class="edge" d="M780,76 V180" marker-end="url(#hk-arrow)"/>
          <text class="t-lbl" x="788" y="128">now</text>
          <path class="edge" d="M930,76 V150 H870 V180" marker-end="url(#hk-arrow)"/>
          <text class="t-lbl" x="938" y="116">online</text>
          <path class="edge" d="M800,240 V310" marker-end="url(#hk-arrow)"/>
          <text class="t-lbl" x="810" y="280">its inputs</text>
          <path class="edge" d="M800,356 V420" marker-end="url(#hk-arrow)"/>
          <text class="t-lbl" x="810" y="392">screen</text>
